# ---------------------------------------------------------------- 製程事件

[events.drift]                 # 雷射機台功率衰減 -> 孔徑逐批變小，保養後歸零
machines = ["LDR-01"]
items = ["VIA_TOP_D", "VIA_BOT_D"]
rate_per_lot = -0.35           # 每經過一批的偏移量（μm）
pm_interval_lots = 10          # 該機台每處理幾批做一次保養

[events.material_shift]        # 從第 N 個 ABF 膜批開始，介電層厚度跳一階
item = "ABF_THK"
from_material_index = 3        # 0 起算
delta = 1.8

[events.bath_aging]            # 電鍍藥水老化 -> 變異變大，換槽後恢復
items = ["PLT_CU"]
aging_per_lot = 0.12           # 標準差倍率每批增加
bath_interval_lots = 12

[events.qtime_over]            # 雷射到電鍍等太久 -> 後段缺陷增加
probability = 0.06
extra_wait_hours = [6.0, 12.0]
affected_items = ["AOI_DEF", "ET_FAIL"]
mean_multiplier = 5.0

[events.oos_spike]             # 偶發單點異常（超出規格，但不是資料錯誤）
probability_per_value = 0.002
sigma = 6.0

[events.split]                 # 防焊重工分批
probability = 0.08
at_station = "F10"
child_panels = 5
