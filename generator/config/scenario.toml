# 模擬情境。所有數值皆為模擬設定，不代表任何公司的真實製程或規格。

[scenario]
company = "Demo Substrate Co."
start = "2026-11-02T08:00:00"
release_interval_hours = 1.5
panels_per_lot = 20
sample_panels = 3          # 連續型項目每批抽幾片
points_per_panel = 5       # 每片量幾個點
qtime_limit_hours = 8.0    # 雷射鑽孔(B20)完成 -> 電鍍銅(B60)開始
operators = 12
lot_pattern = '^L\d{6}[A-Z]\d{3}(-S\d)?$'

[scale]
small = 8
medium = 60
large = 600

[materials]
abf_lots_per_material = 6     # 一個 ABF 膜批供應幾個生產批
core_lots_per_material = 8

[[parts]]
part_no = "PN-ABF-1001"
name = "伺服器處理器載板 A"
line = "A"

[[parts]]
part_no = "PN-ABF-1002"
name = "網通晶片載板 B"
line = "B"

[[parts]]
part_no = "PN-ABF-1003"
name = "AI 加速器載板 C"
line = "C"

