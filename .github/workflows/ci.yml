name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inspection
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: inspection_trace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inspection -d inspection_trace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://inspection:ci-only-password@localhost:5432/inspection_trace

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Migrations match models
        run: uv run alembic check

      - name: Tests
        run: uv run pytest

  image-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: inspection-trace-image-ci
      POSTGRES_USER: inspection
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: inspection_trace

    steps:
      - uses: actions/checkout@v7

      - name: Build application image
        run: docker compose build app

      - name: Initialize temporary database from the image
        run: |
          docker compose up -d --wait --wait-timeout 60 db
          docker compose run --rm --no-deps -T app alembic upgrade head
          docker compose run --rm --no-deps -T -v "$PWD/samples/truth:/ci-truth:ro" \
            app python -m inspection_trace.seed --truth-dir /ci-truth --yes

      - name: Check image health and import a sample
        shell: bash
        run: |
          docker compose up -d --no-build --no-deps app
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 \
            --connect-timeout 2 --max-time 5 --retry-max-time 45 http://127.0.0.1:8000/health
          curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @samples/files/MES_OLD_C40_1151103.csv \
            'http://127.0.0.1:8000/imports?file_name=MES_OLD_C40_1151103.csv' | python3 -c '
          import json
          import sys

          batch = json.load(sys.stdin)
          observed = (batch["status"], batch["inserted_count"], batch["error_count"])
          if observed != ("ACCEPT", 6, 0):
              sys.exit(f"Unexpected C40 import result: {observed!r}")
          print("C40 sample accepted: 6 measurements, 0 errors.")
          '

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove temporary services and volumes
        if: always()
        run: docker compose down --volumes
